name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

env:
  NODE_VERSION: '24.14.0'

jobs:
  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install component-build-helper lib
        run: npm install -g @elastic.io/component-build-helper

      - name: Build and publish docker image
        run: build_component_docker

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @- <<EOF
          {
            "channel": "${{ secrets.SLACK_DEFAULT_CHANNEL }}",
            "blocks": [
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": ":red_circle: *${{ github.event.repository.name }}*:*${{ github.ref_name }}* build failed"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Job" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Notify Slack on success
        if: success()
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @- <<EOF
          {
            "channel": "${{ secrets.SLACK_DEFAULT_CHANNEL }}",
            "blocks": [
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": ":tada: *${{ github.event.repository.name }}*:*${{ github.ref_name }}* was successfully built and published"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Job" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF